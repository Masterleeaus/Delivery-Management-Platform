<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Delivery Management Reference Application architecture</title><desc id="desc">Laravel users enter authenticated tenant scope and access modular client, agent, order, truck, support, and manager surfaces over tenant data.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152437"/><stop offset="1" stop-color="#b76542"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ffc183"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#ffc183}.t{font:700 32px Segoe UI,Arial;fill:#fffaf5}.s{font:400 15px Segoe UI,Arial;fill:#f5dfd2}.n{fill:#344e70;stroke:#788aa0;stroke-width:2}.g{fill:#526983;stroke:#ffc183;stroke-width:2}.y{fill:#3b5551;stroke:#a8e8d8;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#f0ded4}.q{font:400 12px Segoe UI,Arial;fill:#d9c4bb}.r{stroke:#ffc183;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">DELIVERY MANAGEMENT � TENANT-AWARE MODULE MAP</text><text x="64" y="106" class="t">Delivery operations organized as attributed Laravel modules</text><text x="64" y="136" class="s">Source-backed from app/, modules/, Sanctum dependency, module manifests, and PHPUnit tooling.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Users</text><text x="195" y="290" text-anchor="middle" class="b">client � agent � manager</text><text x="195" y="318" text-anchor="middle" class="q">Sanctum + role/permission</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Tenant boundary</text><text x="555" y="290" text-anchor="middle" class="b">company-scoped access</text><text x="555" y="318" text-anchor="middle" class="q">Laravel application</text><path d="M680 285H790" class="r"/><rect x="790" y="150" width="250" height="110" rx="16" class="g"/><text x="915" y="188" text-anchor="middle" class="l">Client + Order</text><text x="915" y="218" text-anchor="middle" class="b">customer and delivery work</text><rect x="790" y="300" width="250" height="110" rx="16" class="g"/><text x="915" y="338" text-anchor="middle" class="l">Agent + Truck</text><text x="915" y="368" text-anchor="middle" class="b">field and fleet modules</text><path d="M1040 205H1150M1040 355H1150" class="r"/><rect x="1150" y="220" width="280" height="190" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Manager + Support</text><text x="1290" y="294" text-anchor="middle" class="b">admin surfaces</text><text x="1290" y="322" text-anchor="middle" class="b">tenant operations</text><text x="1290" y="350" text-anchor="middle" class="q">upstream lineage retained</text><path d="M1290 410V520H940" class="r"/><rect x="650" y="540" width="580" height="92" rx="16" class="n"/><text x="940" y="577" text-anchor="middle" class="l">Modular delivery application</text><text x="940" y="604" text-anchor="middle" class="q">order, fleet, role, and support domains over tenant data</text></svg>

