<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Delivery Management Reference Application</title><desc id="desc">A blue and orange delivery banner showing authentication, tenant scope, orders, agents, fleet, and support with upstream attribution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152437"/><stop offset="1" stop-color="#b76542"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 41px Segoe UI,Arial;fill:#fffaf5}.s{font:600 15px Segoe UI,Arial;letter-spacing:2px;fill:#f5dfd2}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#ffc183}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#dfc9c0}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#ffc183" opacity=".12"/><text x="70" y="66" class="e">DELIVERY MANAGEMENT � LARAVEL MODULAR MONOLITH � ATTRIBUTED SOURCE</text><text x="70" y="125" class="t">Delivery Management Reference Application</text><text x="72" y="160" class="s">AUTH    TENANT    ORDERS    AGENTS    FLEET    SUPPORT</text><path d="M110 245H1090" stroke="#788aa0" stroke-width="2"/><path d="M144 245H1050" stroke="#ffc183" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#3d5575" stroke="#ffc183" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Auth</text><text x="144" y="312" text-anchor="middle" class="q">Sanctum + roles</text><circle cx="383" cy="245" r="24" fill="#3d5575" stroke="#ffc183" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Tenant</text><text x="383" y="312" text-anchor="middle" class="q">company scope</text><circle cx="622" cy="245" r="24" fill="#3d5575" stroke="#ffc183" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Orders</text><text x="622" y="312" text-anchor="middle" class="q">client workflow</text><circle cx="861" cy="245" r="24" fill="#3d5575" stroke="#ffc183" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="l">Fleet</text><text x="861" y="312" text-anchor="middle" class="q">agents + trucks</text><circle cx="1050" cy="245" r="24" fill="#3b5551" stroke="#a8e8d8" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Support</text><text x="1050" y="312" text-anchor="middle" class="q">admin surface</text></g><text x="70" y="342" class="q">Reference source retains upstream Mohaphez lineage; no original authorship claim is made</text></svg>

