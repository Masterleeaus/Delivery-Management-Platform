name: Build & Deploy to Stage

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  verify:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: testing
      CENTRAL_DOMAINS: localhost,center.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: intl, zip, gd, pdo_mysql, opcache, pcntl, bcmath, sockets, exif, imagick, redis, apcu, memcached, mongodb

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: |
          php -v
          composer -V
          composer install --no-interaction --prefer-dist --optimize-autoloader
        env:
          COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache

      - name: Configure SQLite test database
        run: |
          cp .env.development.template .env
          php artisan key:generate --force
          rm -f testing
          touch testing
          php artisan about

      - name: Migrate and seed modules
        run: |
          php artisan module:migrate
          php artisan module:seed

      - name: Run application test suite
        run: php artisan test

      - name: Run maintained profile and tenant-boundary tests
        run: >-
          php artisan test
          modules/User/Tests/Feature/API/V1/Profile/ProfileControllerTest.php
          modules/Tenant/Tests/Feature/TenantBoundaryTest.php

  build-deploy:
    needs: verify
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev' && needs.verify.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: intl, zip, gd, pdo_mysql, opcache, pcntl, bcmath, sockets, exif, imagick, redis, apcu, memcached, mongodb

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.OWNER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./.github/deploy/stage/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/app:dev
